seed: 42

data:
  raw_path: data/H2.csv
  all_models_path: src/data/All_models_data.csv
  expected_raw_rows: 79330
  expected_columns: 31

classification:
  target: IsCanceled
  prediction_point: booking creation time
  output_dir: outputs/classification

  cleaning:
    drop_duplicates: true
    # Fixed domain limits, not computed from the data, so no statistic crosses the
    # train/test split. A row is removed when its value is above the limit.
    outlier_limits:
      ADR: 500
      LeadTime: 500
      TotalNights: 21
      Babies: 2

  features:
    # Fixed when the booking is created. Use this list for the reported results.
    strict:
      numeric:
        - LeadTime
        - ArrivalDateWeekNumber
        - ArrivalDateDayOfMonth
        - StaysInWeekendNights
        - StaysInWeekNights
        - Adults
        - Children
        - Babies
        - IsRepeatedGuest
        - PreviousCancellations
        - PreviousBookingsNotCanceled
        - ADR
      categorical:
        - ArrivalDateMonth
        - Meal
        - MarketSegment
        - DistributionChannel
        - ReservedRoomType
        - CustomerType
        - Agent
        - Company
    # Strict plus the borderline columns, to measure how much they inflate results.
    relaxed_extra:
      numeric:
        - ArrivalDateYear
        - TotalOfSpecialRequests
      categorical:
        - Country
        - DepositType
    # Never used as a classification input.
    drop:
      - IsCanceled
      - ReservationStatus
      - ReservationStatusDate
      - AssignedRoomType
      - BookingChanges
      - DaysInWaitingList
      - RequiredCarParkingSpaces
