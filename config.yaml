seed: 42

data:
  raw_path: data/H2.csv
  all_models_path: src/data/All_models_data.csv
  expected_raw_rows: 79330
  expected_columns: 31

classification:
  target: IsCanceled
  prediction_point: booking creation time
  output_dir: outputs/classification

  cleaning:
    drop_duplicates: true
    # Fixed domain limits, not computed from the data, so no statistic crosses the
    # train/test split. A row is removed when its value is above the limit.
    outlier_limits:
      ADR: 500
      LeadTime: 500
      TotalNights: 21
      Babies: 2

  split:
    val_size: 0.2
    test_size: 0.1
    cv_folds: 5
  
  tuning:
    scoring: average_precision   # PR-AUC
    n_iter: 25                   # random combinations tried per model
    search_spaces:
      random_forest:
        model__n_estimators: {type: int, low: 100, high: 300}
        model__max_depth: {type: int, low: 5, high: 40}
        model__min_samples_leaf: {type: int, low: 1, high: 30}
        model__max_features: {type: choice, values: [sqrt, log2, 0.3, 0.5]}
      decision_tree:
        model__max_depth: {type: int, low: 3, high: 30}
        model__min_samples_leaf: {type: int, low: 1, high: 100}
        model__min_samples_split: {type: int, low: 2, high: 50}
        model__criterion: {type: choice, values: [gini, entropy]}
      mlp:
        model__hidden_layer_sizes: {type: choice, values: [[64], [128], [64, 32], [128, 64]]}
        model__alpha: {type: float, low: 0.00001, high: 0.1, log: true}
        model__learning_rate_init: {type: float, low: 0.0001, high: 0.01, log: true}
      # class_weight is left to the imbalance experiment (T4), so it is not tuned here.
      logistic_regression:
        model__C: {type: float, low: 0.001, high: 100, log: true}
      gaussian_nb:
        model__var_smoothing: {type: float, low: 1.0e-12, high: 1.0, log: true}
      xgboost:
        model__n_estimators: {type: int, low: 100, high: 600}
        model__max_depth: {type: int, low: 3, high: 10}
        model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
        model__subsample: {type: float, low: 0.6, high: 1.0}
        model__colsample_bytree: {type: float, low: 0.5, high: 1.0}
        model__min_child_weight: {type: int, low: 1, high: 10}
        model__reg_lambda: {type: float, low: 0.001, high: 10, log: true}

  features:
    # Fixed when the booking is created. Use this list for the reported results.
    strict:
      numeric:
        - LeadTime
        - ArrivalDateWeekNumber
        - ArrivalDateDayOfMonth
        - StaysInWeekendNights
        - StaysInWeekNights
        - Adults
        - Children
        - Babies
        - IsRepeatedGuest
        - PreviousCancellations
        - PreviousBookingsNotCanceled
        - ADR
      categorical:
        - ArrivalDateMonth
        - Meal
        - MarketSegment
        - DistributionChannel
        - ReservedRoomType
        - CustomerType
        - Agent
        - Company
    # Strict plus the borderline columns, to measure how much they inflate results.
    relaxed_extra:
      numeric:
        - ArrivalDateYear
        - TotalOfSpecialRequests
      categorical:
        - Country
        - DepositType
    # Never used as a classification input.
    drop:
      - IsCanceled
      - ReservationStatus
      - ReservationStatusDate
      - AssignedRoomType
      - BookingChanges
      - DaysInWaitingList
      - RequiredCarParkingSpaces

clustering:
  # Analysis point: booking creation time. Segments are discovered from attributes known
  # when the booking is made; no outcome or post-booking column is a clustering input.
  scaled_path: outputs/Clustering/kmeans_cleaned_scaled.csv
  output_dir: outputs/Clustering
  artifact_dir: artifacts/clustering
  silhouette_sample: 10000     # silhouette is O(n^2): fixed random sample, seeded
  k_range: [2, 13]             # k = 2..12 (python range, end exclusive)
  baseline:                    # Milestone 1: untuned configuration (sklearn defaults)
    n_clusters: 8
    n_init: 10
